<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ゾンビフェイス</title>
<meta name="description" content="マイクラのゾンビの顔を、すきな写真にかえよう。">
<style>
  :root{
    --bg:#f6f8f3; --panel:#ffffff; --panel2:#eef2e8;
    --line:#dfe4d6; --text:#20281a; --muted:#6f7a63;
    --green:#69b533; --green-d:#4d8f22; --accent:#3f7d1a;
    --gold:#e0a52a; --gold-bg:#fff7e4; --gold-line:#ecd39a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 80% at 50% -8%, #ecf4e2 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  .wrap{max-width:460px; margin:0 auto; padding:22px 18px 40px;}
  header{text-align:center; padding:6px 0 2px;}
  .logo{font-size:2rem; font-weight:800; margin:0; letter-spacing:.02em;}
  .logo .z{color:var(--green);}

  .big{display:flex; align-items:center; justify-content:center; gap:12px; width:100%;
    border:none; border-radius:18px; padding:22px; font-size:1.3rem; font-weight:800;
    cursor:pointer; font-family:inherit; margin-top:20px; color:#fff;}
  .big:active{transform:translateY(1px);}
  .big .ic{font-size:1.6rem;}
  .big-pick{background:linear-gradient(180deg,#6dbb37,var(--green-d)); box-shadow:0 4px 14px rgba(77,143,34,.28);}
  .big-dl{background:linear-gradient(180deg,#7cc63f,#58a22b); box-shadow:0 4px 14px rgba(88,162,43,.30);}
  .big:disabled{opacity:.55;}

  .dots{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px; font-size:.95rem; color:var(--muted);}
  .dot{width:16px; height:16px; border-radius:50%; background:var(--panel2); border:2px solid var(--line);}
  .dot.on{background:var(--green); border-color:var(--green);}
  .dots .inf{color:var(--gold); font-weight:800; font-size:1.15rem;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:16px; box-shadow:0 2px 10px rgba(40,60,20,.05);}
  .stage{display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .editor-box{position:relative; width:210px; height:210px; border-radius:14px; overflow:hidden; background:#eef1ea; border:1px solid var(--line); touch-action:none; cursor:grab;}
  .editor-box.dragging{cursor:grabbing;}
  #editor{display:block; width:100%; height:100%;}
  .editor-hint{position:absolute; left:0; right:0; bottom:0; text-align:center; font-size:.72rem; padding:4px; color:#fff; background:linear-gradient(transparent,rgba(0,0,0,.5)); pointer-events:none;}
  .result{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .head-frame{width:120px; height:120px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; padding:9px;}
  #resultFace{width:100%; height:100%; image-rendering:pixelated; border-radius:5px;}
  .result small{color:var(--muted); font-size:.75rem;}
  .row{display:flex; align-items:center; gap:12px; margin-top:14px;}
  .row label{font-size:1.3rem;}
  input[type=range]{flex:1; accent-color:var(--green); height:30px;}
  .rechoose{display:block; margin:12px auto 0; background:none; border:none; color:var(--muted); font-size:.9rem; cursor:pointer; font-family:inherit; text-decoration:underline;}

  .plans-title{text-align:center; font-size:1rem; font-weight:800; color:var(--accent); margin:26px 0 2px;}
  .pricing{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
  .plan{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 14px; text-align:center; position:relative; box-shadow:0 2px 10px rgba(40,60,20,.05);}
  .plan.pro{border-color:var(--gold-line); background:var(--gold-bg);}
  .plan h3{margin:0; font-size:1.05rem;}
  .plan .price{font-size:1.7rem; font-weight:800; margin:6px 0 2px;}
  .plan .price small{font-size:.8rem; font-weight:600; color:var(--muted);}
  .plan .desc{font-size:.95rem; color:var(--text); margin:2px 0 0; font-weight:700;}
  .ribbon{position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:var(--gold); color:#fff; font-size:.7rem; font-weight:800; padding:2px 10px; border-radius:999px;}
  .pick{margin-top:14px; width:100%; border:none; border-radius:12px; padding:12px; font-weight:800; cursor:pointer; font-family:inherit; font-size:.95rem;}
  .pick.gold{background:var(--gold); color:#fff;}
  .pick.plain{background:var(--panel2); color:var(--muted); border:1px solid var(--line);}

  details.help{margin-top:22px;}
  details.help summary{cursor:pointer; list-style:none; text-align:center; color:var(--muted); font-size:.85rem;}
  details.help summary::-webkit-details-marker{display:none}
  details.help .body{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-top:8px; font-size:.85rem;}
  details.help ol{margin:0; padding-left:1.2em;}
  details.help li{margin:5px 0;}

  footer{margin-top:26px; text-align:center; font-size:.72rem; color:var(--muted);}
  footer a{color:var(--green);}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#20281a; color:#fff; border:1px solid var(--green); padding:12px 18px; border-radius:12px; font-size:.9rem; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:90%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal{position:fixed; inset:0; background:rgba(30,40,15,.45); display:none; align-items:center; justify-content:center; padding:18px; z-index:70;}
  .modal.show{display:flex;}
  .modal .box{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:24px 20px; max-width:360px; width:100%; text-align:center; box-shadow:0 12px 40px rgba(20,30,10,.25);}
  .modal .big-emoji{font-size:2.4rem;}
  .modal h2{margin:6px 0 2px; font-size:1.3rem;}
  .modal .lead{color:var(--text); font-size:1rem; margin:0 0 4px;}
  .modal .price{font-size:1.6rem; font-weight:800; margin:8px 0;}
  .modal .price small{font-size:.85rem; color:var(--muted); font-weight:600;}
  .modal .disclaim{font-size:.72rem; color:var(--muted); margin:12px 0 0;}
  .modal .close{background:none; border:none; color:var(--muted); font-size:.85rem; cursor:pointer; margin-top:12px; width:100%; font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">🧟 <span class="z">ゾンビ</span>フェイス</h1>
  </header>

  <button id="pickBtn" class="big big-pick"><span class="ic">📷</span>しゃしんをえらぶ</button>
  <input id="fileInput" type="file" accept="image/*" style="display:none">

  <div id="editCard" class="card" style="display:none">
    <div class="stage">
      <div class="editor-box" id="editorBox">
        <canvas id="editor" width="210" height="210"></canvas>
        <div class="editor-hint">ドラッグでうごかす</div>
      </div>
      <div class="result">
        <div class="head-frame"><canvas id="resultFace" width="120" height="120"></canvas></div>
        <small>できあがり</small>
      </div>
    </div>
    <div class="row">
      <label>🔍</label>
      <input id="zoom" type="range" min="100" max="320" value="100">
    </div>
    <button id="rechooseBtn" class="rechoose">えらびなおす</button>
  </div>

  <button id="downloadBtn" class="big big-dl" style="display:none"><span class="ic">⬇️</span>ダウンロード</button>
  <div id="dots" class="dots" style="display:none"></div>

  <div class="plans-title">プラン</div>
  <div class="pricing">
    <div class="plan">
      <h3>むりょう</h3>
      <div class="price">¥0</div>
      <div class="desc">3かいまで</div>
      <button id="pickFree" class="pick plain">つかってる</button>
    </div>
    <div class="plan pro">
      <span class="ribbon">おすすめ</span>
      <h3>プレミアム</h3>
      <div class="price">¥300<small>/月</small></div>
      <div class="desc">むせいげん</div>
      <button id="pickPro" class="pick gold">えらぶ</button>
    </div>
  </div>

  <details class="help">
    <summary>？ マイクラへの入れかた</summary>
    <div class="body">
      <ol>
        <li><b>zombieface.mcpack</b> をタップ →「Minecraftで開く」</li>
        <li>マイクラの設定でパックを <b>ON</b> にする</li>
        <li>ワールドに入るとゾンビが変身！🧟</li>
      </ol>
    </div>
  </details>

  <footer>
    <a href="./privacy/">プライバシーポリシー</a> ・ 非公式ツール
  </footer>
</div>

<div class="modal" id="upModal">
  <div class="box">
    <div class="big-emoji">🌟</div>
    <h2>プレミアム</h2>
    <p class="lead">かおの変更が <b>むせいげん</b>に！</p>
    <div class="price">¥300<small> / 月</small></div>
    <button id="doUpgrade" class="pick gold">プレミアムにする</button>
    <p class="disclaim">お支払い機能は準備中です。いまは無料でおためしできます。</p>
    <button class="close" id="closeModal">とじる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  var S=8, TEX=64*S, FACE=8*S, EDIT=210;
  var SKIN=[106,154,84], SHIRT=[74,122,135], PANTS=[58,63,107];
  var UUID1="e5b1a7c2-4f3d-4a1e-9c8b-000000000001", UUID2="e5b1a7c2-4f3d-4a1e-9c8b-000000000002";
  var FREE_LIMIT=3;

  function load(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  var used=parseInt(load("zf_used","0"),10); if(isNaN(used)||used<0) used=0;
  var premium=load("zf_premium","0")==="1";

  var img=null, zoom=1, offX=0, offY=0;
  var $=function(id){ return document.getElementById(id); };
  var fileInput=$("fileInput"), pickBtn=$("pickBtn"), rechooseBtn=$("rechooseBtn");
  var editor=$("editor"), editorBox=$("editorBox"), resultFace=$("resultFace");
  var zoomEl=$("zoom"), downloadBtn=$("downloadBtn"), dots=$("dots");
  var editCard=$("editCard"), toastEl=$("toast");
  var pickPro=$("pickPro"), pickFree=$("pickFree");
  var upModal=$("upModal"), doUpgrade=$("doUpgrade"), closeModal=$("closeModal");
  var ectx=editor.getContext("2d");
  var rctx=resultFace.getContext("2d"); rctx.imageSmoothingEnabled=false;

  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){ toastEl.classList.remove("show"); },2600); }
  function remaining(){ return Math.max(0, FREE_LIMIT-used); }

  function refreshUI(){
    if(dots.style.display!=="none"){
      if(premium){ dots.innerHTML='<span class="inf">∞</span> むせいげん'; }
      else{
        var html='のこり ';
        for(var i=0;i<FREE_LIMIT;i++){ html+='<span class="dot'+(i<remaining()?' on':'')+'"></span>'; }
        dots.innerHTML=html;
      }
    }
    if(premium){
      pickFree.textContent="むりょうに戻す"; pickFree.disabled=false; pickFree.classList.remove("plain");
      pickPro.textContent="つかってる"; pickPro.disabled=true; pickPro.style.opacity=".7";
    }else{
      pickFree.textContent="つかってる"; pickFree.disabled=true; pickFree.classList.add("plain");
      pickPro.textContent="えらぶ"; pickPro.disabled=false; pickPro.style.opacity="1";
    }
  }
  function openModal(){ upModal.classList.add("show"); }
  function hideModal(){ upModal.classList.remove("show"); }
  function goPremium(){ premium=true; save("zf_premium","1"); refreshUI(); hideModal(); toast("⭐ プレミアムになりました！"); }

  pickPro.addEventListener("click", openModal);
  doUpgrade.addEventListener("click", goPremium);
  closeModal.addEventListener("click", hideModal);
  upModal.addEventListener("click", function(e){ if(e.target===upModal) hideModal(); });
  pickFree.addEventListener("click", function(){ if(premium){ premium=false; save("zf_premium","0"); refreshUI(); toast("むりょうに戻しました"); } });

  function baseScale(){ if(!img) return 1; return Math.max(EDIT/img.width, EDIT/img.height); }
  function drawParams(){ var ds=baseScale()*zoom, dw=img.width*ds, dh=img.height*ds; return { x:(EDIT-dw)/2+offX, y:(EDIT-dh)/2+offY, w:dw, h:dh }; }
  function renderEditor(){
    ectx.clearRect(0,0,EDIT,EDIT); ectx.fillStyle="#eef1ea"; ectx.fillRect(0,0,EDIT,EDIT);
    if(img){ var p=drawParams(); ectx.imageSmoothingEnabled=true; ectx.drawImage(img,p.x,p.y,p.w,p.h); }
    renderResult();
  }
  function faceCanvas(){
    var c=document.createElement("canvas"); c.width=FACE; c.height=FACE;
    var x=c.getContext("2d"); x.imageSmoothingEnabled=true;
    x.fillStyle="rgb("+SKIN.join(",")+")"; x.fillRect(0,0,FACE,FACE);
    if(img){ var k=FACE/EDIT, p=drawParams(); x.drawImage(img,p.x*k,p.y*k,p.w*k,p.h*k); }
    return c;
  }
  function renderResult(){ var f=faceCanvas(); rctx.clearRect(0,0,120,120); rctx.imageSmoothingEnabled=false; rctx.drawImage(f,0,0,120,120); }

  function fillRect(x,rgb,X,Y,W,H){ x.fillStyle="rgb("+rgb.join(",")+")"; x.fillRect(X*S,Y*S,W*S,H*S); }
  function buildTexture(){
    var c=document.createElement("canvas"); c.width=TEX; c.height=TEX;
    var x=c.getContext("2d"); x.imageSmoothingEnabled=false; x.clearRect(0,0,TEX,TEX);
    fillRect(x,SKIN,0,0,64,64);
    fillRect(x,SHIRT,16,16,24,16); fillRect(x,SHIRT,40,16,16,16); fillRect(x,SHIRT,32,48,16,16);
    fillRect(x,PANTS,0,16,16,16); fillRect(x,PANTS,16,48,16,16);
    x.globalAlpha=0.10;
    for(var i=0;i<TEX*TEX/26;i++){ var px=(Math.random()*TEX)|0, py=(Math.random()*TEX)|0; x.fillStyle=Math.random()<0.5?"#000":"#2c3a12"; x.fillRect(px,py,S,S); }
    x.globalAlpha=1;
    x.drawImage(faceCanvas(),8*S,8*S,FACE,FACE);
    return c;
  }

  var crcTable=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
  function crc32(buf){var c=0xFFFFFFFF;for(var i=0;i<buf.length;i++)c=crcTable[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  function u16(n){return [n&255,(n>>>8)&255];}
  function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];}
  function zip(files){
    var chunks=[], central=[], offset=0;
    files.forEach(function(f){
      var name=new TextEncoder().encode(f.name);
      var crc=crc32(f.data), sz=f.data.length;
      var lh=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(name.length),u16(0));
      var lhb=new Uint8Array(lh.length+name.length); lhb.set(lh,0); lhb.set(name,lh.length);
      chunks.push(lhb); chunks.push(f.data);
      var ch=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
      var chb=new Uint8Array(ch.length+name.length); chb.set(ch,0); chb.set(name,ch.length);
      central.push(chb); offset+=lhb.length+sz;
    });
    var cdSize=central.reduce(function(a,b){return a+b.length;},0);
    var end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(offset),u16(0));
    var parts=chunks.concat(central,[new Uint8Array(end)]);
    var total=parts.reduce(function(a,b){return a+b.length;},0);
    var out=new Uint8Array(total), pos=0; parts.forEach(function(p){ out.set(p,pos); pos+=p.length; });
    return out;
  }
  function canvasToBytes(canvas){ return new Promise(function(res){ canvas.toBlob(function(b){ b.arrayBuffer().then(function(ab){ res(new Uint8Array(ab)); }); },"image/png"); }); }
  function manifest(){ return { format_version:2, header:{ name:"ゾンビフェイス", description:"ゾンビの顔をあなたの写真に（zari Lab）", uuid:UUID1, version:[1,0,0], min_engine_version:[1,16,0] }, modules:[ { type:"resources", uuid:UUID2, version:[1,0,0] } ] }; }
  async function makePack(){
    var tex=buildTexture();
    var icon=document.createElement("canvas"); icon.width=128; icon.height=128; icon.getContext("2d").drawImage(faceCanvas(),0,0,128,128);
    var texBytes=await canvasToBytes(tex), iconBytes=await canvasToBytes(icon);
    var manBytes=new TextEncoder().encode(JSON.stringify(manifest(),null,2));
    var data=zip([ {name:"manifest.json",data:manBytes}, {name:"pack_icon.png",data:iconBytes}, {name:"textures/entity/zombie/zombie.png",data:texBytes} ]);
    return new Blob([data],{type:"application/octet-stream"});
  }

  pickBtn.addEventListener("click",function(){ fileInput.click(); });
  rechooseBtn.addEventListener("click",function(){ fileInput.click(); });
  fileInput.addEventListener("change",function(e){
    var file=e.target.files&&e.target.files[0]; if(!file) return;
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      img=im; zoom=1; offX=0; offY=0; zoomEl.value=100;
      editCard.style.display="block"; downloadBtn.style.display="flex"; dots.style.display="flex";
      pickBtn.querySelector(".ic").textContent="✅"; pickBtn.childNodes[1].nodeValue="べつのしゃしん";
      renderEditor(); refreshUI();
      URL.revokeObjectURL(url);
      editCard.scrollIntoView({behavior:"smooth",block:"center"});
    };
    im.onerror=function(){ toast("この画像はひらけませんでした"); };
    im.src=url;
  });
  zoomEl.addEventListener("input",function(){ zoom=zoomEl.value/100; renderEditor(); });

  var dragging=false,lastX=0,lastY=0;
  editorBox.addEventListener("pointerdown",function(e){ if(!img) return; dragging=true; lastX=e.clientX; lastY=e.clientY; editorBox.classList.add("dragging"); editorBox.setPointerCapture(e.pointerId); });
  editorBox.addEventListener("pointermove",function(e){ if(!dragging) return; offX+=(e.clientX-lastX); offY+=(e.clientY-lastY); lastX=e.clientX; lastY=e.clientY; renderEditor(); });
  function endDrag(){ dragging=false; editorBox.classList.remove("dragging"); }
  editorBox.addEventListener("pointerup",endDrag); editorBox.addEventListener("pointercancel",endDrag);

  downloadBtn.addEventListener("click",async function(){
    if(!img){ toast("さきに写真をえらんでね"); return; }
    if(!premium && remaining()<=0){ openModal(); return; }
    downloadBtn.disabled=true; var old=downloadBtn.innerHTML; downloadBtn.innerHTML='<span class="ic">⏳</span>つくってる…';
    try{
      var blob=await makePack(), url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download="zombieface.mcpack";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },4000);
      if(!premium){ used++; save("zf_used",String(used)); }
      refreshUI();
      toast("できた！マイクラでひらいてね🧟");
    }catch(err){ toast("しっぱいしました: "+err.message); }
    downloadBtn.innerHTML=old; downloadBtn.disabled=false;
  });

  refreshUI();
})();
</script>
</body>
</html>
